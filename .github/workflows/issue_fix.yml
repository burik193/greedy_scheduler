name: AIIssueFix

on:
  issues:
    types:
      - labeled

jobs:
  fix_issue:
    if: github.event.label.name == 'ai_automation'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write
      models: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create branch
        id: branch
        run: |
          BRANCH_NAME="ai-fix/issue-${{ github.event.issue.number }}"
          git checkout -b $BRANCH_NAME
          git push --set-upstream origin $BRANCH_NAME
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create a plan
        id: plan
        uses: actions/ai-inference@v1
        with:
          prompt: |
            You are an expert software developer. Your task is to create a detailed, step-by-step plan to address the following GitHub issue.
            The plan should be a list of concrete actions, like "modify file X to do Y".
            Repository snapshot: files present are README (may be absent), .gitignore (may be absent), greedy.py, grid.py, order.py, consistency_report.json. Prefer to add new files using unified diff with /dev/null for creations.
            Issue Title: ${{ github.event.issue.title }}
            Issue Body: ${{ github.event.issue.body }}
            Your plan:
          max-tokens: 600

      - name: Implement (Attempt 1)
        id: implement_1
        uses: actions/ai-inference@v1
        with:
          prompt: |
            You are an expert software developer. Your task is to implement the following plan to fix a GitHub issue.
            You have access to the full repository.
            Your response must be ONLY a valid unified diff (a .patch file). Do not include any explanation or other text.
            If you include fences, use ```patch. Ensure paths match the current repository structure.
            Repository snapshot: files present are README (may be absent), .gitignore (may be absent), greedy.py, grid.py, order.py, consistency_report.json. When adding files, use /dev/null as the source in the diff. Avoid editing files that do not exist unless you create them in the same diff.

            The plan is:
            ${{ steps.plan.outputs.response }}

            Your implementation:
          max-tokens: 2000

      - name: Apply (Attempt 1)
        id: apply_1
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          response = """${{ steps.implement_1.outputs.response }}"""
          patch_content = ""

          # Find content within ```patch fences
          match = re.search(r"```patch\s*\n(.*?)\n```", response, re.DOTALL)
          if match:
              patch_content = match.group(1)
          else:
              # If no fences, check if the whole response is a diff
              if response.strip().startswith("diff --git"):
                  patch_content = response.strip()

          if not patch_content:
              print("No diff detected in response.")
              sys.exit(1)

          # Split the content by the diff separator, keeping the separator
          # The pattern looks for "diff --git" that is not at the start of the string
          patches = re.split(r'(?<!^)(diff --git)', patch_content)
          
          # The result of the split is ['content1', 'diff --git', 'content2', 'diff --git', 'content3', ...]
          # We need to re-assemble it into ['diff --git content1', 'diff --git content2', ...]
          full_patches = []
          if patch_content.startswith("diff --git"):
              # The first item is the content of the first patch
              full_patches.append(patches[0])
              # Then we combine the separator with the content that follows
              for i in range(1, len(patches), 2):
                  if i + 1 < len(patches):
                      full_patches.append(patches[i] + patches[i+1])
          
          if not full_patches:
              print("Could not parse any valid patch sections.")
              sys.exit(1)

          print(f"Detected {len(full_patches)} patch(es) to apply.")

          for i, patch in enumerate(full_patches):
              if not patch.strip():
                  continue
              
              patch_file = f"changes_{i}.patch"
              with open(patch_file, "w") as f:
                  f.write(patch)
              
              print(f"\n--- Applying patch {i+1}/{len(full_patches)} ---")
              print(patch)
              print("------------------------------------")

              # Use --reject to handle cases where a patch doesn't apply cleanly
              # It will apply the parts that it can and create .rej files for the rest.
              # We check the exit code to see if it was successful.
              if os.system(f"git apply --verbose {patch_file}") != 0:
                  print(f"Error applying patch {i+1}. See output above.")
                  # We can decide to stop or continue. For now, let's stop.
                  sys.exit(1)
              
              print(f"Patch {i+1} applied successfully.")

          print("All patches applied successfully.")
          PY
        shell: bash

      - name: Implement (Attempt 2)
        id: implement_2
        if: steps.apply_1.outputs.status != 'success'
        uses: actions/ai-inference@v1
        with:
          prompt: |
            You are an expert software developer. Your task is to implement the following plan to fix a GitHub issue.
            You have access to the full repository.
            Your response must be ONLY a valid unified diff (a .patch file). Do not include any explanation or other text.
            If you include fences, use ```patch. Ensure paths match the current repository structure.
            Repository snapshot: files present are README (may be absent), .gitignore (may be absent), greedy.py, grid.py, order.py, consistency_report.json. When adding files, use /dev/null as the source in the diff. Avoid editing files that do not exist unless you create them in the same diff.

            The plan is:
            ${{ steps.plan.outputs.response }}

            Your implementation:
          max-tokens: 2000

      - name: Apply (Attempt 2)
        id: apply_2
        if: steps.apply_1.outputs.status != 'success'
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          response = """${{ steps.implement_2.outputs.response }}"""
          patch_content = ""

          # Find content within ```patch fences
          match = re.search(r"```patch\s*\n(.*?)\n```", response, re.DOTALL)
          if match:
              patch_content = match.group(1)
          else:
              # If no fences, check if the whole response is a diff
              if response.strip().startswith("diff --git"):
                  patch_content = response.strip()

          if not patch_content:
              print("No diff detected in response.")
              sys.exit(1)

          # Split the content by the diff separator, keeping the separator
          # The pattern looks for "diff --git" that is not at the start of the string
          patches = re.split(r'(?<!^)(diff --git)', patch_content)
          
          # The result of the split is ['content1', 'diff --git', 'content2', 'diff --git', 'content3', ...]
          # We need to re-assemble it into ['diff --git content1', 'diff --git content2', ...]
          full_patches = []
          if patch_content.startswith("diff --git"):
              # The first item is the content of the first patch
              full_patches.append(patches[0])
              # Then we combine the separator with the content that follows
              for i in range(1, len(patches), 2):
                  if i + 1 < len(patches):
                      full_patches.append(patches[i] + patches[i+1])
          
          if not full_patches:
              print("Could not parse any valid patch sections.")
              sys.exit(1)

          print(f"Detected {len(full_patches)} patch(es) to apply.")

          for i, patch in enumerate(full_patches):
              if not patch.strip():
                  continue
              
              patch_file = f"changes_{i}.patch"
              with open(patch_file, "w") as f:
                  f.write(patch)
              
              print(f"\n--- Applying patch {i+1}/{len(full_patches)} ---")
              print(patch)
              print("------------------------------------")

              # Use --reject to handle cases where a patch doesn't apply cleanly
              # It will apply the parts that it can and create .rej files for the rest.
              # We check the exit code to see if it was successful.
              if os.system(f"git apply --verbose {patch_file}") != 0:
                  print(f"Error applying patch {i+1}. See output above.")
                  # We can decide to stop or continue. For now, let's stop.
                  sys.exit(1)
              
              print(f"Patch {i+1} applied successfully.")

          print("All patches applied successfully.")
          PY
        shell: bash

      - name: Implement (Attempt 3)
        id: implement_3
        if: steps.apply_1.outputs.status != 'success' && steps.apply_2.outputs.status != 'success'
        uses: actions/ai-inference@v1
        with:
          prompt: |
            You are an expert software developer. Your task is to implement the following plan to fix a GitHub issue.
            You have access to the full repository.
            Your response must be ONLY a valid unified diff (a .patch file). Do not include any explanation or other text.
            If you include fences, use ```patch. Ensure paths match the current repository structure.
            Repository snapshot: files present are README (may be absent), .gitignore (may be absent), greedy.py, grid.py, order.py, consistency_report.json. When adding files, use /dev/null as the source in the diff. Avoid editing files that do not exist unless you create them in the same diff.

            The plan is:
            ${{ steps.plan.outputs.response }}

            Your implementation:
          max-tokens: 2000

      - name: Apply (Attempt 3)
        id: apply_3
        if: steps.apply_1.outputs.status != 'success' && steps.apply_2.outputs.status != 'success'
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          response = """${{ steps.implement_3.outputs.response }}"""
          patch_content = ""

          # Find content within ```patch fences
          match = re.search(r"```patch\s*\n(.*?)\n```", response, re.DOTALL)
          if match:
              patch_content = match.group(1)
          else:
              # If no fences, check if the whole response is a diff
              if response.strip().startswith("diff --git"):
                  patch_content = response.strip()

          if not patch_content:
              print("No diff detected in response.")
              sys.exit(1)

          # Split the content by the diff separator, keeping the separator
          # The pattern looks for "diff --git" that is not at the start of the string
          patches = re.split(r'(?<!^)(diff --git)', patch_content)
          
          # The result of the split is ['content1', 'diff --git', 'content2', 'diff --git', 'content3', ...]
          # We need to re-assemble it into ['diff --git content1', 'diff --git content2', ...]
          full_patches = []
          if patch_content.startswith("diff --git"):
              # The first item is the content of the first patch
              full_patches.append(patches[0])
              # Then we combine the separator with the content that follows
              for i in range(1, len(patches), 2):
                  if i + 1 < len(patches):
                      full_patches.append(patches[i] + patches[i+1])
          
          if not full_patches:
              print("Could not parse any valid patch sections.")
              sys.exit(1)

          print(f"Detected {len(full_patches)} patch(es) to apply.")

          for i, patch in enumerate(full_patches):
              if not patch.strip():
                  continue
              
              patch_file = f"changes_{i}.patch"
              with open(patch_file, "w") as f:
                  f.write(patch)
              
              print(f"\n--- Applying patch {i+1}/{len(full_patches)} ---")
              print(patch)
              print("------------------------------------")

              # Use --reject to handle cases where a patch doesn't apply cleanly
              # It will apply the parts that it can and create .rej files for the rest.
              # We check the exit code to see if it was successful.
              if os.system(f"git apply --verbose {patch_file}") != 0:
                  print(f"Error applying patch {i+1}. See output above.")
                  # We can decide to stop or continue. For now, let's stop.
                  sys.exit(1)
              
              print(f"Patch {i+1} applied successfully.")

          print("All patches applied successfully.")
          PY
        shell: bash

      - name: Fail if no success
        if: steps.apply_1.outputs.status != 'success' && steps.apply_2.outputs.status != 'success' && steps.apply_3.outputs.status != 'success'
        run: |
          echo "All attempts to apply the patch failed."
          exit 1

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "feat: Implement fix for issue #${{ github.event.issue.number }}"
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        id: pr
        run: |
          pr_url=$(gh pr create --base main --head ${{ steps.branch.outputs.name }} --title "Fix for issue #${{ github.event.issue.number }}" --body "This PR implements a fix for issue #${{ github.event.issue.number }}. Please review the changes.")
          echo "pr_url=$pr_url" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on issue
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "I've created a pull request to address this issue. Please review the changes here: ${{ steps.pr.outputs.pr_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
